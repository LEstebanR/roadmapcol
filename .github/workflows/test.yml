name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Run tests
        run: bunx vitest run

  coverage:
    name: Coverage (100% required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Enforce 100% coverage
        run: bun run test:coverage
